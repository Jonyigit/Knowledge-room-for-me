            }

            function openKnowledgeModal(id = null) {
                const k = id ? Store.data.knowledge.find((x) => x.id === id) : null;
                const ov = $("#modalOverlay");
                const mc = $("#modalContent");
                const isAuto = k && k.sourceTopicId;
                mc.innerHTML = `
    <h2>${k ? "Yozuvni tahrirlash" : "Yangi bilim yozuvi"}</h2>
    ${isAuto ? `<p style="font-size:.8rem;color:var(--text-3);margin-bottom:12px;padding:8px 10px;background:var(--bg-hover);border-radius:var(--radius-s);">Bu yozuv "Mavzular" bo'limidan avtomatik yaratilgan.</p>` : ""}
    <div class="form-group">
      <label>Sarlavha *</label>
      <input class="form-input" id="kTitle" value="${esc(k ? k.title : "")}" placeholder="Masalan: Albert Einstein" />
      <div class="form-error" id="kTitleErr">Sarlavha kiritish shart.</div>
    </div>
    <div class="form-group">
      <label>Kategoriya</label>
      <input class="form-input" id="kCat" value="${esc(k ? k.category : "")}" placeholder="Mashhur odamlar, Fan, Tarix…" />
    </div>
    <div class="form-group">
      <label>Mazmun *</label>
      <textarea class="form-textarea" id="kBody" rows="5" placeholder="Nima o'rgandingiz?">${esc(k ? k.body : "")}</textarea>
      <div class="form-error" id="kBodyErr">Mazmun kiritish shart.</div>
    </div>
    <div class="form-group">
      <label>Teglar (vergul bilan)</label>
      <input class="form-input" id="kTags" value="${esc(k ? (k.tags || []).join(", ") : "")}" placeholder="fizika, fan, nobel" />
    </div>
    <div class="modal-actions">
      <button class="btn" id="kCancel">Bekor qilish</button>
      <button class="btn btn-primary" id="kSave">${k ? "Saqlash" : "Qo'shish"}</button>
    </div>`;
                ov.classList.add("open");
                const close = () => ov.classList.remove("open");
                $("#kCancel").onclick = close;
                $("#kSave").onclick = () => {
                    const title = $("#kTitle").value.trim();
                    const body = $("#kBody").value.trim();
                    let ok = true;
                    if (!title) {
                        $("#kTitleErr").classList.add("show");
                        ok = false;
                    }
                    if (!body) {
                        $("#kBodyErr").classList.add("show");
                        ok = false;
                    }
                    if (!ok) return;
                    const data = {
                        title,
                        category: $("#kCat").value.trim() || "Umumiy",
                        body,
                        tags: $("#kTags")
                            .value.split(",")
                            .map((s) => s.trim())
                            .filter(Boolean),
                    };
                    if (k) {
                        Store.updateKnowledge(k.id, data);
                        toast("Yozuv yangilandi");
                    } else {
                        Store.addKnowledge({
                            id: uid("k"),
                            ...data,
                            createdAt: new Date().toISOString(),
                            sourceTopicId: null,
                        });
                        toast("Yozuv qo'shildi");
                    }
                    close();
                    Router.render();
                };
                ov.onclick = (e) => {
                    if (e.target === ov) close();
                };
                $("#kTitle").focus();
            }

            /* ========== ROUTER ========== */
            const Router = {
                page: "topics",
                detailId: null,

                go(page, detailId = null) {
                    this.page = page;
                    this.detailId = detailId;
                    const hash = detailId ? `#${page}/${detailId}` : `#${page}`;
                    if (location.hash !== hash) history.pushState(null, "", hash);
                    this.render();
                    this.syncNav();
                    $("#sidebar").classList.remove("open");
                },

                parse() {
                    const h = location.hash.replace("#", "") || "topics";
                    const [p, id] = h.split("/");
                    return { page: p, id };
                },

                render() {
                    const c = $("#page");
                    const p = this.page;
                    let html = "";
                    if (p === "topics") html = this.detailId ? renderTopicDetail(this.detailId) : renderTopics();
                    else if (p === "progress") html = renderProgress();
                    else if (p === "quotes") html = renderQuotes();
                    else if (p === "knowledge") html = renderKnowledge();
                    else html = renderTopics();
                    c.innerHTML = html;
                    this.bind();
                    window.scrollTo(0, 0);
                },

                syncNav() {
                    $$(".nav-btn").forEach((b) => {
                        b.classList.toggle("active", b.dataset.page === this.page);
                    });
                },

                bind() {
                    // Topics
                    $$(".topic-card[data-topic-id]").forEach((c) => {
                        c.onclick = () => this.go("topics", c.dataset.topicId);
                    });
                    $$('[data-action="add-topic"]').forEach((b) => (b.onclick = () => openTopicModal()));
                    $$('[data-action="back-topics"]').forEach((b) => (b.onclick = () => this.go("topics")));
                    $$('[data-action="goto-knowledge"]').forEach((b) => {
                        b.onclick = (e) => {
                            e.preventDefault();
                            this.go("knowledge");
                        };
                    });
                    $$('[data-action="toggle-topic"]').forEach((b) => {
                        b.onclick = () => {
                            const result = Store.toggleTopicStatus(b.dataset.id);
                            if (result.synced) {
                                toast("Mavzu tugatildi va Bilimlar bazasiga qo'shildi");
                            } else if (result.removed) {
                                toast("Mavzu qayta \"O'rganilmoqda\" holatiga o'tkazildi");
                            }
                            this.render();
                        };
                    });
                    $$('[data-action="edit-topic"]').forEach((b) => (b.onclick = () => openTopicModal(b.dataset.id)));
                    $$('[data-action="delete-topic"]').forEach((b) => {
                        b.onclick = () => {
                            confirmDialog(
                                "Mavzuni o'chirish?",
                                "Bu amalni qaytarib bo'lmaydi. Agar mavzu Bilimlar bazasiga bog'langan bo'lsa, u yozuv ham o'chiriladi.",
                                () => {
                                    Store.deleteTopic(b.dataset.id);
                                    this.go("topics");
                                    toast("Mavzu o'chirildi");
                                },
                            );
                        };
                    });

                    // === SHAXSIY QAYD — saqlash + jonli yangilash ===
                    $$('[data-action="save-topic-notes"]').forEach((b) => {
                        b.onclick = () => {
                            const ta = $("#topicNotes");
                            if (ta) {
                                Store.updateTopic(b.dataset.id, { notes: ta.value });
                                const t = Store.data.topics.find((x) => x.id === b.dataset.id);
                                if (t && t.status === "completed" && t.knowledgeId) {
                                    Store.syncTopicToKnowledge(t);
                                    Store.save();
                                }
                                // Yangilangan vizual holat
                                const meta = $("#noteMeta");
                                const status = $("#noteStatus");
                                const words = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
                                if (meta) {
                                    meta.textContent = words ? words + " so'z" : "Hali bo'sh";
                                    meta.classList.toggle("has-content", words > 0);
                                }
                                if (status) {
                                    status.innerHTML = words
                                        ? '<span class="note-status-dot saved"></span> Saqlangan'
                                        : '<span class="note-status-dot"></span> Hali yozilmagan';
                                }
                                toast("Qayd saqlandi");
                            }
                        };
                    });

                    // === JONLI SO'Z SANAGICHI ===
                    const noteTa = $("#topicNotes");
                    if (noteTa) {
                        const updateNoteMeta = () => {
                            const meta = $("#noteMeta");
                            if (meta) {
                                const words = noteTa.value.trim() ? noteTa.value.trim().split(/\s+/).length : 0;
                                meta.textContent = words ? words + " so'z" : "Hali bo'sh";
                                meta.classList.toggle("has-content", words > 0);
                            }
                        };
                        noteTa.addEventListener("input", updateNoteMeta);
                        updateNoteMeta();
                    }

                    // Topic filters
                    const tf = $("#topicFilter"),
                        ts = $("#topicSearch");
                    if (tf && ts) {
                        const apply = () => {
                            const cat = tf.value,
                                q = ts.value.toLowerCase();
                            $$("#topicGrid .topic-card").forEach((c) => {
                                const t = Store.data.topics.find((x) => x.id === c.dataset.topicId);
                                if (!t) return;
                                const okCat = cat === "all" || t.status === cat;
                                const okQ =
                                    !q ||
                                    t.title.toLowerCase().includes(q) ||
                                    t.description.toLowerCase().includes(q) ||
                                    t.category.toLowerCase().includes(q);
                                c.style.display = okCat && okQ ? "" : "none";
                            });
                        };
                        tf.onchange = apply;
                        ts.oninput = apply;
                    }

                    // Quotes
                    $$('[data-action="add-quote"]').forEach((b) => (b.onclick = () => openQuoteModal()));
                    $$('[data-action="edit-quote"]').forEach(
                        (b) =>
                            (b.onclick = (e) => {
                                e.stopPropagation();
                                openQuoteModal(b.dataset.id);
                            }),
                    );
                    $$('[data-action="delete-quote"]').forEach((b) => {
                        b.onclick = (e) => {
                            e.stopPropagation();
                            confirmDialog("Iqtibosni o'chirish?", "Bu amalni qaytarib bo'lmaydi.", () => {
                                Store.deleteQuote(b.dataset.id);
                                this.render();
                                toast("Iqtibos o'chirildi");
                            });
                        };
                    });
                    const qs = $("#quoteSearch");
                    if (qs) {
                        qs.oninput = () => {
                            const q = qs.value.toLowerCase();
                            $$("#quoteList .quote-card").forEach((c) => {
                                const item = Store.data.quotes.find((x) => x.id === c.dataset.quoteId);
                                if (!item) return;
                                const ok =
                                    !q || item.text.toLowerCase().includes(q) || item.author.toLowerCase().includes(q);
                                c.style.display = ok ? "" : "none";
                            });
                        };
                    }

                    // Knowledge
                    $$('[data-action="add-knowledge"]').forEach((b) => (b.onclick = () => openKnowledgeModal()));
                    $$('[data-action="edit-knowledge"]').forEach(
                        (b) =>
                            (b.onclick = (e) => {
                                e.stopPropagation();
                                openKnowledgeModal(b.dataset.id);
                            }),
                    );
                    $$('[data-action="delete-knowledge"]').forEach((b) => {
                        b.onclick = (e) => {
                            e.stopPropagation();
                            confirmDialog("Yozuvni o'chirish?", "Bu amalni qaytarib bo'lmaydi.", () => {
                                Store.deleteKnowledge(b.dataset.id);
                                this.render();
                                toast("Yozuv o'chirildi");
                            });
                        };
                    });
                    const kf = $("#kFilter"),
                        ks = $("#kSearch");
                    if (kf && ks) {
                        const apply = () => {
                            const cat = kf.value,
                                q = ks.value.toLowerCase();
                            $$("#kGrid .k-card").forEach((c) => {
                                const item = Store.data.knowledge.find((x) => x.id === c.dataset.kId);
                                if (!item) return;
                                const okCat = cat === "all" || item.category === cat;
                                const okQ =
                                    !q ||
                                    item.title.toLowerCase().includes(q) ||
                                    item.body.toLowerCase().includes(q) ||
                                    (item.tags || []).some((t) => t.toLowerCase().includes(q));
                                c.style.display = okCat && okQ ? "" : "none";
                            });
                        };
                        kf.onchange = apply;
                        ks.oninput = apply;
                    }
                },
            };

            /* ========== GLOBAL SEARCH ========== */
            function initSearch() {
                const input = $("#searchInput");
                const res = $("#searchResults");
                if (!input || !res) return;

                input.addEventListener("input", () => {
                    const q = input.value.trim().toLowerCase();
                    if (!q) {
                        res.classList.remove("open");
                        res.innerHTML = "";
                        return;
                    }
                    const matches = [];
                    Store.data.topics.forEach((t) => {
                        if (
                            t.title.toLowerCase().includes(q) ||
                            t.description.toLowerCase().includes(q) ||
                            t.category.toLowerCase().includes(q)
                        )
                            matches.push({ type: "Mavzu", title: t.title, page: "topics", id: t.id });
                    });
                    Store.data.quotes.forEach((qq) => {
                        if (qq.text.toLowerCase().includes(q) || qq.author.toLowerCase().includes(q))
                            matches.push({ type: "Iqtibos", title: qq.text.slice(0, 60), page: "quotes" });
                    });
                    Store.data.knowledge.forEach((k) => {
                        if (
                            k.title.toLowerCase().includes(q) ||
                            k.body.toLowerCase().includes(q) ||
                            (k.tags || []).some((t) => t.toLowerCase().includes(q))
                        )
                            matches.push({ type: "Bilim", title: k.title, page: "knowledge" });
                    });
                    if (!matches.length) {
                        res.innerHTML = `<div class="sr-empty">"${esc(q)}" bo'yicha natija yo'q</div>`;
                    } else {
                        res.innerHTML = matches
                            .slice(0, 8)
                            .map(
                                (m) => `
        <div class="sr-item" data-page="${m.page}" data-id="${m.id || ""}">
          <div class="sr-type">${esc(m.type)}</div>
          <div class="sr-title">${esc(m.title)}</div>
        </div>`,
                            )
                            .join("");
                        $$(".sr-item", res).forEach((el) => {
                            el.onclick = () => {
                                res.classList.remove("open");
                                input.value = "";
                                Router.go(el.dataset.page, el.dataset.id || null);
                            };
                        });
                    }
                    res.classList.add("open");
                });

                document.addEventListener("click", (e) => {
                    if (!e.target.closest("#searchWrap")) res.classList.remove("open");
                });
            }

            /* ========== INIT ========== */
            function init() {
                Store.load();

                $$(".nav-btn").forEach((b) => (b.onclick = () => Router.go(b.dataset.page)));
                $("#themeBtn").onclick = () => Store.toggleTheme();
                $("#exportBtn").onclick = () => Store.export();
                $("#hamburger").onclick = () => $("#sidebar").classList.toggle("open");

                document.addEventListener("click", (e) => {
                    if (window.innerWidth <= 820) {
                        const sb = $("#sidebar");
                        if (
                            sb.classList.contains("open") &&
                            !e.target.closest("#sidebar") &&
                            !e.target.closest("#hamburger")
                        ) {
                            sb.classList.remove("open");
                        }
                    }
                });

                window.addEventListener("popstate", () => {
                    const { page, id } = Router.parse();
                    Router.page = page || "topics";
                    Router.detailId = id || null;
                    Router.render();
                    Router.syncNav();
                });

                const { page, id } = Router.parse();
                Router.page = page || "topics";
                Router.detailId = id || null;
                Router.render();
                Router.syncNav();

                initSearch();

                const ov = $("#modalOverlay");
                ov.addEventListener("click", (e) => {
                    if (e.target === ov) ov.classList.remove("open");
                });

                document.addEventListener("keydown", (e) => {
                    if (e.key === "Escape") {
                        if (ov.classList.contains("open")) ov.classList.remove("open");
                        const sr = $("#searchResults");
                        if (sr) sr.classList.remove("open");
                    }
                });
            }

            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
            else init();
        </script>

        <script>
            /* THE KNOWLEDGE ROOM — PWA support */
            (() => {
                const installButton = document.getElementById("pwaInstallBtn");
                const networkStatus = document.getElementById("pwaNetworkStatus");
                let installPrompt = null;
                const isStandalone = () =>
                    window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

                function updateNetworkStatus() {
                    if (!networkStatus) return;
                    networkStatus.textContent = navigator.onLine ? "Online" : "Offline";
                    networkStatus.style.color = navigator.onLine ? "var(--success)" : "var(--warning)";
                }
                window.addEventListener("online", updateNetworkStatus);
                window.addEventListener("offline", updateNetworkStatus);
                updateNetworkStatus();

                if (isStandalone() && installButton) installButton.hidden = true;

                window.addEventListener("beforeinstallprompt", (event) => {
                    event.preventDefault();
                    installPrompt = event;
                    if (installButton && !isStandalone()) installButton.hidden = false;
                });

                if (installButton) {
                    installButton.addEventListener("click", async () => {
                        if (isStandalone()) {
                            installButton.hidden = true;
                            return;
                        }
                        if (installPrompt) {
                            installPrompt.prompt();
                            await installPrompt.userChoice;
                            installPrompt = null;
                            installButton.hidden = true;
                            return;
                        }
                        const ua = navigator.userAgent || "";
                        if (/iphone|ipad|ipod/i.test(ua)) {
                            alert(
                                "iPhone yoki iPad’da: Safari orqali saytni oching → Share (Ulashish) → Add to Home Screen (Bosh ekranga qo‘shish) → Add.",
                            );
                        } else if (/android/i.test(ua)) {
                            alert(
                                "Chrome menyusini (⋮) oching va ‘Install app’ yoki ‘Add to Home screen’ bandini tanlang.",
                            );
                        } else {
                            alert("Brauzer menyusidan ‘Install app’ yoki ‘Add to Home screen’ bandini tanlang.");
                        }
                    });
                }

                window.addEventListener("appinstalled", () => {
                    if (installButton) installButton.hidden = true;
                    installPrompt = null;
                });

                if (
                    "serviceWorker" in navigator &&
                    (location.protocol === "https:" || location.hostname === "localhost")
                ) {
                    window.addEventListener("load", async () => {
                        try {
                            const registration = await navigator.serviceWorker.register("./sw.js", { scope: "./" });
                            registration.addEventListener("updatefound", () => {
                                const worker = registration.installing;
                                if (!worker) return;
                                worker.addEventListener("statechange", () => {
                                    if (worker.state === "installed" && navigator.serviceWorker.controller) {
                                        console.info("The Knowledge Room: yangi versiya tayyor.");
                                    }
                                });
                            });
                            if (navigator.storage && navigator.storage.persist) {
                                navigator.storage.persist().catch(() => {});
                            }
                        } catch (error) {
                            console.warn("PWA service worker ro‘yxatdan o‘tmadi:", error);
                        }
                    });
                }
            })();
        </script>
    </body>
</html>
